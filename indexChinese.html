<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星纹叙事台</title>
<script src="./jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  height:100%;
}
body{
  font-family: system-ui, -apple-system, "Microsoft Yahei", sans-serif;
  background:#ffffff;
  color:#222222;
  padding:20px;
  padding-bottom:20px;
  max-width:1000px;
  margin:0 auto;
  position:relative;
}
.page{
  display:none;
  height:100%;
}
.page.active{
  display:block;
}
.tip{
  text-align:center;
  color:#666;
  margin-bottom:15px;
}
.btns{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;}
button{
  padding:10px 18px;font-size:16px;border:none;border-radius:8px;
  background:#366ed8;color:white;cursor:pointer;transition:0.2s;
  -webkit-tap-highlight-color: transparent;
}
button:active{background:#2857b0;}

/* 角色立绘层，底层背景之上，对话框之下 */
.character-layer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:50vh;
  z-index:5;
  pointer-events:none;
  overflow:hidden;
}
.character-layer img{
  width:100%;
  height:100%;
  object-fit:contain;
}

#storyBox{
  background:rgba(245,245,245,0.12);
  padding:24px;
  border-radius:10px;
  min-height:220px;
  line-height:1.8;font-size:16px;
  position:absolute;
  bottom:20px;
  left:20px;
  right:20px;
  max-width:calc(1000px - 40px);
  margin:0 auto;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(6px);
  box-shadow:0 4px 20px rgba(0,0,0,0.25);
  z-index:10;
}
.speaker{
  color:#2b5cb8;font-weight:bold;margin-bottom:4px;
}
.narration{
  color:#555555;margin:12px 0;
}
.choice-area{
  margin-top:20px;display:flex;flex-direction:column;gap:10px;
}
.choice-btn{
  background:#e8edf7;color:#222;text-align:left;
}
.choice-btn:active{background:#d0d9ec;}
#nextBtn{
  position:absolute;
  bottom:calc(220px + 40px);
  right:20px;
  margin:0;
  z-index:11;
}
#exitBtn{
  background:#bb3333;
  position:absolute;
  bottom:20px;
  left:20px;
  z-index:11;
}
#exitBtn:active{background:#992222;}
#fullBtn{
  background:#22aa66;
}
#fullBtn:active{background:#19884f;}
#exitFullBtn{
  background:#9055cc;
}
#exitFullBtn:active{background:#7440aa;}
#clearSaveBtn{
  background:#ed8b27;
}
#clearSaveBtn:active{
  background:#c4701c;
}
#exitFullWrap{
  position:fixed;
  top:12px;
  right:12px;
  z-index:999;
}
#iosTip{
  position:fixed;
  top:12px;
  left:12px;
  z-index:999;
  background:#ffeeee;
  color:#992222;
  padding:6px 8px;
  border-radius:6px;
  font-size:12px;
  display:none;
}
#bgmPlayBtn{
  position:fixed;
  bottom:260px;
  left:20px;
  z-index:99;
  background:#118877;
}
#bgmPlayBtn:active{
  background:#0c6659;
}
.copyright{
  margin-top:30px;
  text-align:center;
  font-size:13px;
  color:#888;
}
.restart-btn{
  background:#6b7280;
}
.restart-btn:active{
  background:#4b5563;
}
.import-export-btn{
  background:#279ed8;
}
.import-export-btn:active{
  background:#1b7cae;
}
.file-input{
  display:none;
}
</style>
</head>
<body>
<div id="iosTip">由于苹果限制，部分安卓有的功能无法使用</div>
<div id="exitFullWrap">
  <button id="exitFullBtn" onclick="exitFull()">退出全屏</button>
</div>

<div class="character-layer" id="charLayer"></div>

<div id="menuPage" class="page active">
  <h1>星纹叙事台</h1>
  <div class="tip">请将手机横向放置，点击「进入全屏」</div>
  <div class="btns">
    <button id="fullBtn" onclick="toggleFull()">进入全屏</button>
    <button id="clearSaveBtn" onclick="clearSave()">清除存档</button>
  </div>
  <div class="btns">
    <button onclick="startScene('scene1')">第一幕（继续进度）</button>
    <button onclick="startScene('scene2')">第二幕（继续进度）</button>
    <button onclick="startScene('scene3')">第三幕（继续进度）</button>
    <button onclick="resumeScene()">继续上次进度</button>
  </div>
  <div class="btns">
    <button class="restart-btn" onclick="startSceneFromBegin('scene1')">第一幕【从头开始】</button>
    <button class="restart-btn" onclick="startSceneFromBegin('scene2')">第二幕【从头开始】</button>
    <button class="restart-btn" onclick="startSceneFromBegin('scene3')">第三幕【从头开始】</button>
  </div>
  <div class="btns">
    <button class="import-export-btn" onclick="exportSave()">导出存档</button>
    <button class="import-export-btn" onclick="document.getElementById('saveImport').click()">导入存档</button>
    <input class="file-input" type="file" id="saveImport" accept=".txt" onchange="importSave(this)">
    <button class="import-export-btn" onclick="document.getElementById('zipUpload').click()">加载资源包ZIP</button>
    <input class="file-input" type="file" id="zipUpload" accept=".zip" onchange="loadResourceZip(this)">
  </div>
  <div class="tip" id="saveTip"></div>
  <div class="copyright">由巧秋072、灵进行代码、剧本制作测试，Version beta0.5，仅供个人娱乐，非盈利、商用，勿传播剧情内部分角色存在ooc勿喷，剧情那部分角色为虚构角色，游戏内不存在，无现实原型。请遵守https://github.com/qiaoqiu072/-Stellar-Weave-Stage‑下的声明</div>
</div>
<div id="storyPage" class="page">
  <button id="bgmPlayBtn" onclick="triggerBGMPlay()" style="display:none;">开启背景音乐</button>
  <button id="nextBtn" onclick="next()" style="display:none;">继续</button>
  <div id="storyBox"></div>
  <button id="exitBtn" onclick="exitStory()">退出剧情</button>
  <div class="copyright">由巧秋072、灵进行代码、剧本制作测试，Version beta0.5，仅供个人娱乐，非盈利、商用，勿传播剧情内部分角色存在ooc勿喷，剧情那部分角色为虚构角色，游戏内不存在，无现实原型。</div>
</div>
<script>
const scenes = {
  scene1: {
    "title": "第一幕：璃月港码头的“学术首映礼”",
    "content": [
      {
        "type": "narration",
        "text": "场景：璃月港码头，正午。阳光很烈，人群熙攘。姚利群不知从哪里搞来了一堆木箱，叠成了一个三层高的“讲台”。讲台正中央竖着一块手写的牌子——“提瓦特理论物理研究院·第48次公开讲座·免费入场·反对者请自带论据·不反对但嘲笑者请自带瓜子”。"
      },
      {
        "type": "narration",
        "text": "刘赵龙站在讲台旁边，手里举着一块更大的牌子，上面写着——“她说的都是错的，不要报警，不要扔菜叶，不要通知千岩军。如果她已经说了超过十分钟，请直接联系往生堂。”"
      },
      {
        "type": "narration",
        "text": "牌子背面还有一行小字：“往生堂电话在牌子背面。胡堂主说报我名字打九折。”"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "（站在三层木箱上，手里举着一个用树莓、薄荷和一块碎琉璃拼成的“天空模型”，模型上还插着几根鸡毛）各位璃月同胞！各位路过的旅行者！各位被生活所迫不得不经过此地的行人！我今天要论证一个颠覆性的事实——"
      },
      {
        "type": "dialog",
        "speaker": "路人甲",
        "text": "（拎着菜篮子）你上次说“风神是假的，是气流成精”。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "（挥手）那个理论已经被我推翻了！因为温迪先生请我喝了一杯酒，酒是真的，所以他是真的。"
      },
      {
        "type": "dialog",
        "speaker": "路人甲",
        "text": "那你上次还说“岩神是假的，是石头成精”。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "那个理论也被我推翻了。因为钟离先生请我喝了一杯茶。"
      },
      {
        "type": "dialog",
        "speaker": "路人甲",
        "text": "钟离先生什么时候请过你喝茶？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "他没有直接请。但他坐在那里喝茶，我看着他喝，四舍五入等于请了。"
      },
      {
        "type": "dialog",
        "speaker": "路人甲",
        "text": "……（默默退后三步）"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "（在本子上写）第43条：姚利群的验证标准是“有没有请她喝酒或间接请她喝茶”。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "但天空不一样！天空从来没有请我喝过酒！也没有请我喝过茶！甚至没有给我递过一杯白开水！这是极其可疑的！"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "（从人群里挤出来，手里抓着半串烤鸟蛋）旅行者！是那个疯子学者！上次她说“派蒙是应急食品理论的最大反例，因为应急食品不会说话”！"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "（跟上来）……"
      },
      {
        "type": "choice",
        "options": [
          {"key":"A","text":"“那次她说的其实挺有道理。”"},
          {"key":"B","text":"“派蒙，别跟她一般见识。”"},
          {"key":"C","text":"“我们听听她说什么。”"}
        ]
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "你说什么？！"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "……没什么。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "你每次都这样！说一半藏一半！上次在稻妻也是，你说“雷电将军其实挺讲道理的”，然后她差点把我劈了！"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "那不一样。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "哪里不一样？！"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "那次是我说错了。这次我没说。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "……你说了！你刚才说了！我听到了！"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "你听错了。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "我没听错！"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "你听错了。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "……旅行者，你被姚利群传染了。你开始耍赖了。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "（目光锁定派蒙）啊！派蒙！来得正好！你是提瓦特唯一一个能飞的生物！"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "我不是生物！我是派蒙！"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "那你是什么？"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "我是……我是派蒙！"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "这是一个循环论证。你没有回答问题。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "你才循环论证！你全家都循环论证！"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "（在本子上写）第43条附注：派蒙在逻辑上处于劣势时会提高音量。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "好，派蒙，我换一个问题——你飞过最高的地方是哪里？"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "呃……群玉阁？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "群玉阁多高？"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "……很高。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "具体多高？"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "……非常高。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "有没有高到碰到天空？"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "（愣住）……没有。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "（转向人群，张开双臂）你们听到了！提瓦特唯一能飞的生物，飞不到天空！这不是因为天空太高，而是因为天空会躲！"
      },
      {
        "type": "dialog",
        "speaker": "路人乙",
        "text": "天空怎么会躲？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "你追过猫吗？猫不想被你抓到的时候，你永远抓不到。天空也一样。你抬头看，它在那里。你飞上去，它还在那里。你永远接近不了它。"
      },
      {
        "type": "dialog",
        "speaker": "路人乙",
        "text": "那是因为天空本来就在很远的地方啊。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "那“很远”是多远？"
      },
      {
        "type": "dialog",
        "speaker": "路人乙",
        "text": "……很远？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "你也在循环论证！你们所有人都在循环论证！这就是天空的阴谋！它让我们用“很远”来解释“很远”，用“很高”来解释“很高”！这是一个语言牢笼！"
      },
      {
        "type": "dialog",
        "speaker": "胡桃",
        "text": "（从人群里冒出来，手里拿着往生堂的宣传单）哎哎哎，这位学者，你上次说“往生堂是璃月最大的地下情报机构”，我回去想了想——"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "那是我的第7号理论，已经被推翻了。"
      },
      {
        "type": "dialog",
        "speaker": "胡桃",
        "text": "被什么推翻了？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "因为你们的情报太差了。我上次问你们“天理住在哪”，你们说“不知道”。真正的情报机构至少会编一个假地址。"
      },
      {
        "type": "dialog",
        "speaker": "胡桃",
        "text": "……有道理。要办卡吗？往生堂会员，死后打折。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "我暂时不需要，谢谢。我可能需要的是天空研究专项基金。"
      },
      {
        "type": "dialog",
        "speaker": "胡桃",
        "text": "那你得去找凝光。不过她上次说“再看见姚利群就把他从群玉阁扔下去”。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "她说的是“她”。我是女的。"
      },
      {
        "type": "dialog",
        "speaker": "胡桃",
        "text": "凝光说“她”的时候，语气更重。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "……那是因为她尊重我。"
      },
      {
        "type": "dialog",
        "speaker": "胡桃",
        "text": "她说的原话是“那个疯女人再敢靠近群玉阁一步，我就让她体验一下什么叫真正的‘高空坠落实验’”。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "（眼睛一亮）高空坠落实验！凝光她懂我！"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "（在本子上写）第43条附注二：姚利群会把任何威胁解读为“学术邀请”。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "（重新站直，举起“天空模型”）各位！我现在要做一个现场演示！"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "（抬头）群姐，你上次的现场演示炸了半个码头。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "那次是意外。那次我在研究“元素力的本质是情绪”，我错在没有考虑到璃月港的渔民情绪普遍是“想把我们扔进海里”。"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "你对着一个渔民说“你的渔网看起来像是不小心从枫丹科学院的垃圾桶里滚出来的”。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "客观描述。而且他后来承认了，那个渔网确实是从枫丹进口的。"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "他说的是“从枫丹进口的”，不是“从枫丹科学院垃圾桶里滚出来的”。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "这两件事不矛盾。"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "（叹气）第43条附注三：姚利群认为“不矛盾”等于“正确”。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "（把“天空模型”举高）各位请看！这个模型代表了提瓦特的天空！树莓代表云层，薄荷代表风，琉璃代表太阳，鸡毛代表——（停顿）鸡毛代表我暂时还没想好，但不重要！"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "鸡毛代表什么？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "代表未知。学术研究最重要的就是承认未知。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "那为什么是鸡毛？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "因为我手边只有鸡毛。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "……你手边为什么会有鸡毛？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "因为我昨天在研究“鸟类的飞行高度是否受到天空假说的影响”，我抓了一只鸡做实验。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "鸡不会飞。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "这正是我的发现！ 鸡不会飞，但鸡有羽毛。这说明羽毛和飞行之间没有必然联系。同理，天空和“真实”之间也可能没有必然联系。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "……旅行者，我头好痛。"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "……"
      },
      {
        "type": "choice",
        "options": [
          {"key":"A","text":"“她在用鸡证明天空是假的。”"},
          {"key":"B","text":"“派蒙，你要学会忽略她。”"},
          {"key":"C","text":"“其实她的逻辑有一点道理。”"}
        ]
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "这能证明吗？"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "不能。但她在尝试。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "你刚才是不是想说“有一点道理”？"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "我没说。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "你说了！你嘴唇动了！"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "我在嗑瓜子。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "你手里没有瓜子！"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "……我嗑完了。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "旅行者！！！"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "现在，我要用这个模型，向大家展示天空的运行机制！（她把模型举到头顶，然后开始转圈）你们看！当我转动模型的时候，你们觉得是模型在转，还是你们在转？"
      },
      {
        "type": "dialog",
        "speaker": "路人丙",
        "text": "是你在转。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "对！但如果你不知道我在转呢？如果你只看模型，不看我的脚呢？"
      },
      {
        "type": "dialog",
        "speaker": "路人丙",
        "text": "……那我会觉得模型在自己转。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "这就是天空的真相！ 我们以为天空在动，是因为我们看不到下面！我们看不到外面！我们看不到那个正在转动天空的人！"
      },
      {
        "type": "narration",
        "text": "全场安静了三秒。"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "（在本子上写）第43条附注四：姚利群的论证第一次让路人沉默了。值得记录。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "（小声）旅行者，她刚才说的……好像有点道理？"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "……"
      },
      {
        "type": "choice",
        "options": [
          {"key":"A","text":"“她每次都说得好有道理。然后你跟她待三天，就会发现她的逻辑是一个圈。”"},
          {"key":"B","text":"“别想了。她说的都是错的。”"},
          {"key":"C","text":"“你想听她继续说吗？”"}
        ]
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "什么圈？"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "她先说“天空是假的”，然后找证据。找不到证据，就说“找不到证据本身就是证据”。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "……那不就是耍赖吗？"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "是。但她说得特别认真，认真到你不好意思说她耍赖。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "……旅行者，你刚才是不是在夸她？"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "没有。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "你有！"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "我在陈述事实。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "你陈述事实的时候嘴角动了！你在笑！"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "……我嗑瓜子嗑的。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "你又说你嗑瓜子！你手里根本没有瓜子！"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "……我嗑完了。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "你刚才也是这么说的！"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "因为它是对的。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "啊——！！！（抱头蹲下）"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "（从木箱上跳下来，差点摔倒，被刘赵龙一把扶住）谢谢。各位！今天的讲座到此结束！明天同一时间，同一地点，我将发表第49次讲座，题目是——"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "（接话）《论姚利群为什么应该被禁止在公共场合演讲》。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "不对。题目是《天空假说与提瓦特社会结构的解构——兼论为什么凝光不敢让我上群玉阁》。"
      },
      {
        "type": "dialog",
        "speaker": "胡桃",
        "text": "我觉得凝光不是“不敢”，是“不想”。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "“不想”就是“不敢”的委婉表达！ 这是语言学的基本常识！"
      },
      {
        "type": "dialog",
        "speaker": "胡桃",
        "text": "……你赢了。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "（突然想起什么）对了，刘赵龙，记录一下——今天的讲座，有多少人听了？"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "（翻本子）根据我的观察，从头听到尾的有：我，派蒙，旅行者，胡桃，还有那个卖菜的路人甲。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "路人甲呢？"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "他在你说“鸡不会飞但鸡有羽毛”的时候走了。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "……那也听了三分之二。不错。比上次多。"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "上次只有我和一条狗。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "那条狗后来怎么了？"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "它跟着我们走了三条街，然后在你说“天空是假的”的时候，它跑了。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "……狗是聪明的。它听懂了。"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "（在本子上写）第43条附注五：姚利群认为“狗跑掉”等于“狗听懂了”。"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "（走上前）你明天还要讲？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "当然！学术研究不能停！"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "你研究这个多久了？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "从我第一次抬头看天空开始。"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "那是多久以前？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "（想了想）……我不记得了。但我的第一本笔记本上写着——“天空可能是假的。今天开始记录。”"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "第一本笔记本还在吗？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "在。但里面画的全是史莱姆。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "为什么画史莱姆？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "因为我当时在研究“史莱姆的弹性是否与天空的弧度有关”。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "……有关吗？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "没有。但我花了三个月才排除这个可能性。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "三个月？！"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "学术研究就是这样。 你要先证明“有关”，才能证明“无关”。如果你直接说“无关”，别人会问“你怎么知道无关”。所以你必须先花三个月研究“有关”，然后告诉大家“有关是错的”。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "那你这三个月不是白费了？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "不。 我这三个月证明了“史莱姆弹性与天空弧度无关”。这是一个结论。结论就是收获。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "……旅行者，我觉得她说得好有道理，但我又觉得哪里不对。"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "……"
      },
      {
        "type": "choice",
        "options": [
          {"key":"A","text":"“这就是姚利群的可怕之处。她说的每一句话单独看都很有道理，连在一起就变成了一团浆糊。”"},
          {"key":"B","text":"“你也有这种感觉，说明你开始理解她了。”"},
          {"key":"C","text":"“别想了。我们去吃饭吧。”"}
        ]
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "……我觉得我脑子要炸了。"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "那就别想了。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "你说得对。我们去吃饭吧。"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "好。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "等等，你刚才是不是想说我“开始理解她了”？"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "没有。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "你犹豫了！"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "我在想吃什么。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "你每次都在想吃什么！"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "因为吃很重要。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "……你赢了。"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "（合上本子）群姐，该走了。你下午还要去不卜庐拿药。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "什么药？"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "安神的。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "我不需要安神。我很清醒。"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "你昨晚几点睡的？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "我没睡。我在写论文。"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "论文题目是什么？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "《论睡眠与天空假说之间的关系——如果天空是假的，那梦是不是也是假的？》"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "……所以你没睡，是因为你在研究“梦是不是假的”？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "对。如果梦是假的，那我睡了也没用。如果梦是真的，那我不睡就是在浪费研究时间。所以无论梦是真是假，我都不应该睡。"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "（沉默三秒）……群姐，你赢了。但药还是要拿。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "为什么？"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "因为白术先生说，如果你再不去拿药，他就要亲自来码头找你，然后当着所有人的面说——“姚利群，你的脑子没有问题，你只是需要睡觉。”"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "（停顿）……白术先生懂我。"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "他说的是“你的脑子没有问题”。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "“没有问题”就是最大的问题！ 如果我的脑子没有问题，那为什么我看到的世界和你们不一样？"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "因为你没睡觉。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "那你们睡了，你们看到的世界就是真的吗？"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "……群姐，我们去拿药。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "你回避了我的问题。"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "对。因为我也没睡好。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "刘赵龙也没睡？"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "她昨晚写论文的时候一直在念，念到凌晨三点。我住在隔壁，墙很薄。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "她念了什么？"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "“天空是假的，天空是假的，天空是假的，但我的论文是真的，所以天空是假的。”"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "……这是论文？"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "这是她的结论。前面还有三千字的论证。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "三千字？"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "我听了。前两千字在讲“史莱姆的弹性”，后一千字在讲“鸡毛的象征意义”。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "……那她的结论是怎么得出来的？"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "她说“因为史莱姆有弹性，所以天空可以弯。因为鸡毛会飘，所以天空可以动。所以天空是假的。”"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "这……这有逻辑吗？"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "没有。但她说得很大声。"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "（已经走出去十米远，回头喊）刘赵龙！走了！我要在去不卜庐的路上思考一个新的问题！"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "什么问题？"
      },
      {
        "type": "dialog",
        "speaker": "姚利群",
        "text": "如果天空是假的，那“不卜庐”的“不卜”是不是也是假的？"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "（对旅行者和派蒙）你们看，这就是我的生活。"
      },
      {
        "type": "dialog",
        "speaker": "旅行者",
        "text": "……"
      },
      {
        "type": "choice",
        "options": [
          {"key":"A","text":"“你为什么不跑？”"},
          {"key":"B","text":"“你其实可以不管她的。”"},
          {"key":"C","text":"“你挺厉害的。”"}
        ]
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "（沉默一会儿）因为她有一次说对了。"
      },
      {
        "type": "dialog",
        "speaker": "派蒙",
        "text": "哪次？"
      },
      {
        "type": "dialog",
        "speaker": "刘赵龙",
        "text": "她说“提瓦特每个人都在假装正常，只有我承认自己疯了”。然后她看着我，说“你是唯一一个不假装的人”。"
      },
      {
        "type": "dialog",

let sceneId = null;
let sceneData = null;
let index = 0;

let resourcePack = {
  loaded: false,
  files: {},
  map: {},
  bgmAudio: null,
  segmentVoiceAudio: null
};

let bgLayer = null;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const iosTipDom = document.getElementById("iosTip");
const charLayerDom = document.getElementById("charLayer");
if(isIOS){
  iosTipDom.style.display = "block";
}

const BGM_NORMAL_VOLUME = 0.7;
const BGM_DUCK_VOLUME = 0.25;

function setCookie(name,value,days=365){
  let d = new Date();
  d.setTime(d.getTime() + (days*24*60*60*1000));
  document.cookie = name + "=" + encodeURIComponent(value) + ";expires="+ d.toUTCString() + ";path=/";
}
function getCookie(name){
  let arr = document.cookie.split('; ');
  for(let i=0;i<arr.length;i++){
    let item = arr[i].split('=');
    if(item[0] === name) return decodeURIComponent(item[1]);
  }
  return null;
}
function loadProgress(){
  let savedRaw;
  if(isIOS){
    savedRaw = getCookie("storyProgress");
  }else{
    savedRaw = localStorage.getItem("storyProgress");
  }
  if(savedRaw){
    const p = JSON.parse(savedRaw);
    document.getElementById("saveTip").innerText = `上次读到：${scenes[p.sceneId].title}，第${p.index+1}段`;
    return p;
  }else{
    document.getElementById("saveTip").innerText = "";
    return null;
  }
}
function saveProgress(){
  const saveData = JSON.stringify({sceneId, index});
  if(isIOS){
    setCookie("storyProgress", saveData);
  }else{
    localStorage.setItem("storyProgress", saveData);
  }
}
function clearSave(){
  if(isIOS){
    setCookie("storyProgress","",-1);
  }else{
    localStorage.removeItem("storyProgress");
  }
  loadProgress();
}
function toggleFull(){
  const docEl = document.documentElement;
  if (!document.fullscreenElement){
    docEl.requestFullscreen?.() || docEl.webkitRequestFullscreen?.();
  }
}
function exitFull(){
  if(document.fullscreenElement){
    document.exitFullscreen?.() || document.webkitExitFullscreen?.();
  }
}
function initBgLayer(){
  if(bgLayer) return;
  bgLayer = document.createElement("div");
  bgLayer.style.position = "fixed";
  bgLayer.style.inset = "0";
  bgLayer.style.zIndex = "-1";
  bgLayer.style.backgroundSize = "cover";
  bgLayer.style.backgroundPosition = "center";
  bgLayer.style.backgroundRepeat = "no-repeat";
  bgLayer.style.transition = "background-image 0.3s ease";
  document.body.appendChild(bgLayer);
}
function clearBgLayer(){
  if(bgLayer){
    bgLayer.style.backgroundImage = "none";
  }
}
function clearCharacterImage(){
  charLayerDom.innerHTML = "";
}

// 根据speaker名字获取立绘路径，优先charKey > speakerToChar映射
function getCharUrlBySpeaker(item){
  if(!resourcePack.loaded) return null;
  if(item.charKey){
    return resourcePack.map?.speakerToChar?.[item.charKey] || null;
  }
  if(item.speaker){
    return resourcePack.map?.speakerToChar?.[item.speaker] || null;
  }
  return null;
}

function setCharacter(item){
  clearCharacterImage();
  const filePath = getCharUrlBySpeaker(item);
  if(!filePath) return;
  const imgUrl = resourcePack.files[filePath];
  if(!imgUrl) return;
  const img = new Image();
  img.src = imgUrl;
  charLayerDom.appendChild(img);
}

// 根据当前剧情index下标拿语音路径
function getVoiceUrlByIndex(idx){
  if(!resourcePack.loaded) return null;
  const voicePath = resourcePack.map?.indexVoice?.[String(idx)];
  if(!voicePath) return null;
  return resourcePack.files[voicePath] || null;
}

// ⭐重点：现在这个函数必须在【用户点击事件同步栈内调用】（next/selectChoice），解决移动端音频拦截
function playSegmentVoiceByIndex(idx){
  if(resourcePack.segmentVoiceAudio){
    resourcePack.segmentVoiceAudio.pause();
    resourcePack.segmentVoiceAudio = null;
  }
  const voiceUrl = getVoiceUrlByIndex(idx);
  if(!voiceUrl) return;

  const voiceAudio = new Audio(voiceUrl);
  resourcePack.segmentVoiceAudio = voiceAudio;

  if(resourcePack.bgmAudio){
    resourcePack.bgmAudio.volume = BGM_DUCK_VOLUME;
  }

  voiceAudio.play().catch(err=>{
    console.log("片段语音播放被浏览器拦截", err);
  });

  voiceAudio.onended = ()=>{
    if(resourcePack.bgmAudio){
      resourcePack.bgmAudio.volume = BGM_NORMAL_VOLUME;
    }
    resourcePack.segmentVoiceAudio = null;
  };
}

function getCurrentBgUrl(){
  if(!resourcePack.loaded) return null;
  const sceneBgMap = resourcePack.map?.sceneBg || {};
  const bgPath = sceneBgMap[sceneId];
  if(!bgPath) return null;
  return resourcePack.files[bgPath] || null;
}
function playSceneBGM(sid){
  if(!resourcePack.loaded) return;
  if(resourcePack.bgmAudio){
    resourcePack.bgmAudio.pause();
    resourcePack.bgmAudio = null;
  }
  const bgmPath = resourcePack.map?.bgm?.[sid];
  if(!bgmPath || !resourcePack.files[bgmPath]){
    document.getElementById("bgmPlayBtn").style.display = "none";
    return;
  }
  const audioUrl = resourcePack.files[bgmPath];
  resourcePack.bgmAudio = new Audio(audioUrl);
  resourcePack.bgmAudio.loop = true;
  resourcePack.bgmAudio.volume = BGM_NORMAL_VOLUME;
  document.getElementById("bgmPlayBtn").style.display = "block";
}
function triggerBGMPlay(){
  if(resourcePack.bgmAudio){
    resourcePack.bgmAudio.play().catch(e=>console.log("BGM播放失败",e));
  }
}

function startScene(id){
  sceneId = id;
  sceneData = scenes[id];
  const p = loadProgress();
  if(p && p.sceneId === id){
    index = p.index;
  }else{
    index = 0;
  }
  document.getElementById("menuPage").classList.remove("active");
  document.getElementById("storyPage").classList.add("active");
  initBgLayer();
  playSceneBGM(id);
  const bgUrl = getCurrentBgUrl();
  if(bgUrl){
    bgLayer.style.backgroundImage = `url(${bgUrl})`;
  }
  saveProgress();
  render();
  // 刚进入剧情，借一次手势尝试播放当前index语音
  playSegmentVoiceByIndex(index);
}
function startSceneFromBegin(id){
  sceneId = id;
  sceneData = scenes[id];
  index = 0;
  document.getElementById("menuPage").classList.remove("active");
  document.getElementById("storyPage").classList.add("active");
  initBgLayer();
  playSceneBGM(id);
  const bgUrl = getCurrentBgUrl();
  if(bgUrl){
    bgLayer.style.backgroundImage = `url(${bgUrl})`;
  }
  saveProgress();
  render();
  playSegmentVoiceByIndex(index);
}
function resumeScene(){
  const p = loadProgress();
  if(!p){
    alert("没有存档");
    return;
  }
  startScene(p.sceneId);
}
function exitStory(){
  if(resourcePack.segmentVoiceAudio){
    resourcePack.segmentVoiceAudio.pause();
    resourcePack.segmentVoiceAudio = null;
  }
  if(resourcePack.bgmAudio){
    resourcePack.bgmAudio.pause();
    resourcePack.bgmAudio = null;
  }
  document.getElementById("bgmPlayBtn").style.display = "none";
  clearBgLayer();
  clearCharacterImage();
  document.getElementById("storyPage").classList.remove("active");
  document.getElementById("menuPage").classList.add("active");
  loadProgress();
}

function render(){
  const box = document.getElementById("storyBox");
  box.innerHTML = "";
  clearCharacterImage();

  if(index >= sceneData.content.length){
    box.innerHTML = "<div class='narration'>剧情全部读完。</div>";
    document.getElementById("nextBtn").style.display = "none";
    return;
  }
  const item = sceneData.content[index];

  if(item.type === "narration"){
    box.innerHTML = `<div class="narration">${item.text}</div>`;
    document.getElementById("nextBtn").style.display = "block";
  }else if(item.type === "dialog"){
    box.innerHTML = `
      <div class="speaker">${item.speaker}</div>
      <div>${item.text}</div>
    `;
    document.getElementById("nextBtn").style.display = "block";
    setCharacter(item);
  }else if(item.type === "choice"){
    let html = `<div>请选择：</div><div class="choice-area">`;
    item.options.forEach(opt=>{
      html += `<button class="choice-btn" onclick="selectChoice('${opt.key}')">${opt.text}</button>`;
    })
    html += `</div>`;
    box.innerHTML = html;
    document.getElementById("nextBtn").style.display = "none";
  }
  saveProgress();
}

// ⭐【继续按钮点击事件】用户真实手势，在这里执行跳转 + 播放新片段音频，绕过移动端自动播放拦截
function next(){
  index++;
  render();
  // 点击继续的手势权限，用来触发本段index对应的语音
  playSegmentVoiceByIndex(index);
}

// ⭐【选择分支点击事件】同样利用用户点击手势权限播放语音
function selectChoice(key){
  const item = sceneData.content[index];
  const selectedOpt = item.options.find(o => o.key === key);
  if(selectedOpt && selectedOpt.targetIndex !== undefined){
    index = selectedOpt.targetIndex;
  }else{
    index++;
  }
  render();
  playSegmentVoiceByIndex(index);
}

function exportSave(){
  const p = loadProgress();
  if(!p){
    alert("暂无存档");
    return;
  }
  const saveText = JSON.stringify(p,null,2);
  const blob = new Blob([saveText], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "story_save.txt";
  a.click();
}
function importSave(inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      const saveData = JSON.stringify(data);
      if(isIOS){
        setCookie("storyProgress", saveData);
      }else{
        localStorage.setItem("storyProgress", saveData);
      }
      loadProgress();
      alert("存档导入成功！");
    }catch(err){
      alert("存档文件解析失败");
    }
  }
  reader.readAsText(file);
}
async function loadResourceZip(inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  const zip = new JSZip();
  try{
    await zip.loadAsync(file);
    resourcePack.files = {};
    const mapFile = zip.file("res_map.json");
    if(!mapFile){
      alert("资源包缺少 res_map.json");
      return;
    }
    const mapText = await mapFile.async("string");
    resourcePack.map = JSON.parse(mapText);
    const allFileKeys = Object.keys(zip.files);
    for(const filePath of allFileKeys){
      const zipEntry = zip.files[filePath];
      if(!zipEntry.dir){
        const blob = await zipEntry.async("blob");
        resourcePack.files[filePath] = URL.createObjectURL(blob);
      }
    }
    resourcePack.loaded = true;
    const fontPath = resourcePack.map.global?.fontPath;
    if(fontPath && resourcePack.files[fontPath]){
      const fontUrl = resourcePack.files[fontPath];
      const fontFace = new FontFace("CustomStoryFont", `url(${fontUrl})`);
      await fontFace.load();
      document.fonts.add(fontFace);
      document.body.style.fontFamily = "CustomStoryFont, system-ui, sans-serif";
    }
    alert(`资源包加载成功，共${allFileKeys.length}个文件，字体已生效`);
  }catch(err){
    console.error(err);
    alert("资源包读取失败：" + err.message);
  }
}
loadProgress();
